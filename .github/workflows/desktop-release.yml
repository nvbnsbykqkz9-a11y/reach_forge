name: Windows installer

# Windows 版（PC 単体）の本番用インストーラーをつくる。
#   - バージョンのタグ（v1.0.0 など）を push：インストーラーをつくり、GitHub の「リリースの下書き」に添付する（公開は手動）
#   - main への push・手動実行、またはコミットのメッセージに [build installer] を含めた push（どのブランチでも）：
#     インストーラーをつくり、成果物（Artifacts）として残す
# コード署名：リポジトリのシークレット WINDOWS_PFX_BASE64（.pfx を Base64 にしたもの）と WINDOWS_PFX_PASSWORD があれば、
#   アプリ本体（ReachForge.exe）とインストーラーに署名する（なければ署名なしでつくる。SmartScreen の警告が出る）。

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    # 対象外の push では、Windows の実行環境を使わずにすぐ終える
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[build installer]')
    runs-on: windows-latest
    env:
      PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          # アプリのバージョン（ReachForge.Desktop.csproj の Version）。タグがあれば一致するか確かめる
          [xml]$proj = Get-Content src/ReachForge.Desktop/ReachForge.Desktop.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "タグ ${{ github.ref_name }} と、アプリのバージョン v$version が一致しません。ReachForge.Desktop.csproj の Version をそろえてください。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, with ffmpeg)
        shell: pwsh
        run: ./deploy/desktop/publish.ps1

      - name: Prepare code signing
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match "x64" } | Sort-Object FullName -Descending | Select-Object -First 1
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          "PFX_PATH=$pfx" >> $env:GITHUB_ENV

      - name: Sign the app
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /f $env:PFX_PATH /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            artifacts/desktop/app/ReachForge.exe
          if ($LASTEXITCODE -ne 0) { throw "アプリ本体の署名に失敗しました" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} deploy/desktop/ReachForge.iss
          if ($LASTEXITCODE -ne 0) { throw "インストーラーの作成に失敗しました" }

      - name: Sign the installer
        if: env.PFX_BASE64 != ''
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /f $env:PFX_PATH /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            (Get-ChildItem artifacts/desktop/ReachForge-Setup-*.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw "インストーラーの署名に失敗しました" }

      - name: Checksum
        shell: pwsh
        run: |
          # 配布先で改ざんされていないか確かめられるよう、SHA-256 を添える
          Get-ChildItem artifacts/desktop/ReachForge-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ReachForge-Setup-${{ steps.version.outputs.version }}
          path: |
            artifacts/desktop/ReachForge-Setup-*.exe
            artifacts/desktop/ReachForge-Setup-*.exe.sha256
      # 同梱した ffmpeg（GPL v3）のソースコード。求めに応じて提供できるよう、インストーラーと一緒に保管する
      - uses: actions/upload-artifact@v4
        with:
          name: ReachForge-ffmpeg-source-${{ steps.version.outputs.version }}
          path: artifacts/desktop/ffmpeg-source/
          if-no-files-found: warn

      - name: Draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ReachForge ${{ steps.version.outputs.version }}
          files: |
            artifacts/desktop/ReachForge-Setup-*.exe
            artifacts/desktop/ReachForge-Setup-*.exe.sha256

      - name: Clean up
        if: always() && env.PFX_BASE64 != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue $env:PFX_PATH
