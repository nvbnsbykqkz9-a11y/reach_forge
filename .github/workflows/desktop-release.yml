name: Windows installer

# Windows 版（PC 単体）の本番用インストーラーをつくる。
#   - バージョンのタグ（v1.0.0 など）を push：インストーラーをつくり、GitHub の「リリースの下書き」に添付する（公開は手動）
#   - main への push・手動実行、またはコミットのメッセージに [build installer] を含めた push（どのブランチでも）：
#     インストーラーをつくり、成果物（Artifacts）として残す
# コード署名（Azure Artifact Signing。秘密鍵は Microsoft の HSM の中にあり、ファイルとしては扱わない）：
#   リポジトリの変数 ARTIFACT_SIGNING_ENDPOINT・ARTIFACT_SIGNING_ACCOUNT・ARTIFACT_SIGNING_PROFILE と、
#   シークレット AZURE_CLIENT_ID・AZURE_TENANT_ID・AZURE_SUBSCRIPTION_ID（OIDC のフェデレーション資格情報を設定したアプリ）があれば、
#   アプリ本体（ReachForge.exe）とインストーラーに署名する（タイムスタンプ付き）。なければ署名なしでつくる（SmartScreen の警告が出る）。

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # Azure へ OIDC でサインインする（コード署名）

jobs:
  installer:
    # 対象外の push では、Windows の実行環境を使わずにすぐ終える
    if: >-
      github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.message, '[build installer]')
    runs-on: windows-latest
    # Azure の OIDC の信頼（フェデレーション資格情報）は、この環境名に対して1つ設定すればよい（ブランチ・タグによらない）
    environment: release
    env:
      SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          # アプリのバージョン（ReachForge.Desktop.csproj の Version）。タグがあれば一致するか確かめる
          [xml]$proj = Get-Content src/ReachForge.Desktop/ReachForge.Desktop.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "タグ ${{ github.ref_name }} と、アプリのバージョン v$version が一致しません。ReachForge.Desktop.csproj の Version をそろえてください。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained, with ffmpeg)
        shell: pwsh
        run: ./deploy/desktop/publish.ps1

      - name: Azure login (code signing)
        if: env.SIGNING_ACCOUNT != ''
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the app
        if: env.SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\desktop\app\ReachForge.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} deploy/desktop/ReachForge.iss
          if ($LASTEXITCODE -ne 0) { throw "インストーラーの作成に失敗しました" }

      - name: Sign the installer
        if: env.SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ env.SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ env.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\artifacts\desktop\ReachForge-Setup-${{ steps.version.outputs.version }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        if: env.SIGNING_ACCOUNT != ''
        shell: pwsh
        run: |
          foreach ($file in @("artifacts/desktop/app/ReachForge.exe", "artifacts/desktop/ReachForge-Setup-${{ steps.version.outputs.version }}.exe")) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") { throw "$file の署名が有効ではありません（$($sig.Status)：$($sig.StatusMessage)）" }
            Write-Host "$file：$($sig.SignerCertificate.Subject)"
          }

      - name: Checksum
        shell: pwsh
        run: |
          # 配布先で改ざんされていないか確かめられるよう、SHA-256 を添える
          Get-ChildItem artifacts/desktop/ReachForge-Setup-*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ReachForge-Setup-${{ steps.version.outputs.version }}
          path: |
            artifacts/desktop/ReachForge-Setup-*.exe
            artifacts/desktop/ReachForge-Setup-*.exe.sha256
      # 同梱した ffmpeg（GPL v3）のソースコード。求めに応じて提供できるよう、インストーラーと一緒に保管する
      - uses: actions/upload-artifact@v4
        with:
          name: ReachForge-ffmpeg-source-${{ steps.version.outputs.version }}
          path: artifacts/desktop/ffmpeg-source/
          if-no-files-found: warn

      - name: Draft release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ReachForge ${{ steps.version.outputs.version }}
          files: |
            artifacts/desktop/ReachForge-Setup-*.exe
            artifacts/desktop/ReachForge-Setup-*.exe.sha256
